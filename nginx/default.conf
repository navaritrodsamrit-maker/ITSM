upstream itsm_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;                     # เปลี่ยนเป็นโดเมนจริง เช่น api.example.com

    client_max_body_size 30m;   # อัปโหลดเอกสาร RAG (backend cap 25MB)

    # ให้ frontend (Vercel) เรียกข้ามโดเมนได้ — ปล่อยให้ FastAPI จัดการ CORS
    # ถ้าอยากให้ nginx จัดการเอง ให้ตั้ง ITSM_CORS_ORIGINS="" แล้วเปิดบล็อกล่าง

    location / {
        proxy_pass         http://itsm_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # RAG: embed เอกสาร / เรียก LLM ใช้เวลานาน
    location /rag/ {
        proxy_pass         http://itsm_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 5s;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://itsm_api/health;
        access_log off;
    }
}

