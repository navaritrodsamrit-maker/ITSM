services:
  api:
    build: .
    image: itsm-watcher-api
    env_file: .env          # ITSM_COOKIE, ITSM_TEAMS_WEBHOOK, ITSM_CORS_ORIGINS, ITSM_ADMIN_TOKEN, ...
    expose:
      - "8000"              # ไม่ publish ออกนอก — ให้ nginx เท่านั้นที่คุยด้วย
    volumes:
      - api_data:/data       # cookie ที่อัปเดตผ่าน UI + คลังความรู้ RAG (rag.db)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # ให้ container ต่อ Ollama บน host ได้
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8001}:80"
      # - "443:443"         # เปิดเมื่อทำ TLS
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

  # tunnel ออกเน็ตให้ Vercel เรียก backend ได้ (TryCloudflare — ไม่ต้องสมัคร ไม่ต้องมีโดเมน
  # ไม่มีหน้า interstitial แบบ ngrok)
  #   docker compose --profile tunnel up -d
  #   ดู URL:  docker compose logs cloudflared | grep trycloudflare.com
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
    restart: unless-stopped

  # ทางเลือก: ngrok (ต้องมี NGROK_AUTHTOKEN ใน .env, มีหน้า warning สำหรับ browser)
  #   docker compose --profile ngrok up -d ngrok
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["ngrok"]
    command: http nginx:80
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  api_data:
