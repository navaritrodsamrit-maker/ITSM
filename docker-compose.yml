services:
  api:
    build: .
    image: itsm-watcher-api
    env_file: .env          # ITSM_COOKIE, ITSM_TEAMS_WEBHOOK, ITSM_CORS_ORIGINS, ...
    expose:
      - "8000"              # ไม่ publish ออกนอก — ให้ nginx เท่านั้นที่คุยด้วย
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      # - "443:443"         # เปิดเมื่อทำ TLS
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped
