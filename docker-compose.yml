services:
  api:
    build: .
    image: itsm-watcher-api
    env_file: .env          # ITSM_COOKIE, ITSM_TEAMS_WEBHOOK, ITSM_CORS_ORIGINS, ...
    expose:
      - "8000"              # ไม่ publish ออกนอก — ให้ nginx เท่านั้นที่คุยด้วย
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8001}:80"
      # - "443:443"         # เปิดเมื่อทำ TLS
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

  # tunnel ออกเน็ตให้ Vercel เรียก backend ได้
  #   docker compose --profile tunnel up -d
  #   ต้องมี NGROK_AUTHTOKEN ใน .env (สมัครฟรี dashboard.ngrok.com)
  #   ดู URL: http://localhost:4040   หรือ  docker compose logs ngrok
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    command: http nginx:80          # มี static domain: เพิ่ม --domain=${NGROK_DOMAIN}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      - nginx
    restart: unless-stopped
